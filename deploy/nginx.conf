server {
    listen 80;
    listen [::]:80;
    server_name xn--80abddfeac9gokb.xn--p1ai www.xn--80abddfeac9gokb.xn--p1ai;

    client_max_body_size 200M;

    # Фото и видео nginx отдаёт с диска сам — быстрее, чем через Node, и с поддержкой Range.
    # Cache-Control — как в next.config.mjs: альбомы субботников append-only (месяц), остальное — сутки.
    location ^~ /photos/subbotnik/ {
        root /var/www/beregdetstva/public;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location ^~ /photos/ {
        root /var/www/beregdetstva/public;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location ^~ /videos/ {
        root /var/www/beregdetstva/public;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
